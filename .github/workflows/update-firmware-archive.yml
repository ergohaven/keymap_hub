name: Update firmware archive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-archive-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve current firmware releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update-firmware-archive.py --write

      - name: Verify generated change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git diff --name-only -- . ':!README.md')"
          if [[ -n "$unexpected" ]]; then
            printf '%s\n' "Unexpected generated files:" "$unexpected" >&2
            exit 1
          fi

      - name: Commit updated links
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "Firmware archive is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update firmware archive"
          git push
